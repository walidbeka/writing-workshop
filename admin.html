<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | ورشة كتابة</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
body{background:#f7f4f1}.admin-wrap{max-width:900px;margin:40px auto;padding:0 18px}
.panel{background:#fff;border:1px solid #e4ddd7;border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.05)}
.field{margin:12px 0}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d0c8;border-radius:9px;font:inherit}
button{border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer}.primary{background:#8B1E2D;color:#fff}.muted{background:#eee7e1}
.login-only,.dashboard{display:none}.login-only.active,.dashboard.active{display:block}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;border-top:1px solid #eee;padding:18px 0}
.msg{margin:12px 0;padding:10px;border-radius:8px;display:none}.ok{background:#eaf7ee;color:#176b35}.err{background:#fff0ef;color:#8B1E2D}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin-wrap">
<div class="panel login-only active" id="login">
<h1>دخول لوحة التحكم</h1>
<p>هذه الصفحة مخصصة لإدارة أسعار الورش.</p>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<div class="msg err" id="loginErr"></div>
<button class="primary" id="loginBtn">دخول</button>
</div>

<div class="panel dashboard" id="dashboard">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
<div><h1>لوحة التحكم</h1><p id="userEmail"></p></div>
<button class="muted" id="logoutBtn">تسجيل الخروج</button>
</div>
<div class="msg ok" id="saveOk">تم حفظ الأسعار.</div>
<div class="msg err" id="saveErr"></div>
<div id="prices"></div>
</div>
</div>

<script>
const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
const login = document.getElementById('login'), dashboard = document.getElementById('dashboard');
const show = (el,on)=>el.classList.toggle('active',on);
const error = (msg)=>{const e=document.getElementById('loginErr');e.textContent=msg;e.style.display='block'};

async function init(){
 const {data}=await supabase.auth.getSession();
 if(data.session) {
   if(data.session.user.email !== "wmr77077@gmail.com") { await supabase.auth.signOut(); error("هذا الحساب غير مصرح له بالدخول."); }
   else openDashboard(data.session);
 } else show(login,true);
}
async function openDashboard(session){
 show(login,false); show(dashboard,true); document.getElementById('userEmail').textContent=session.user.email;
 const {data,error:err}=await supabase.from('workshop_prices').select('*').order('id');
 if(err){document.getElementById('saveErr').textContent=err.message;document.getElementById('saveErr').style.display='block';return}
 document.getElementById('prices').innerHTML=data.map(x=>`
 <div class="row">
   <div><strong>${x.course_name}</strong><div style="font-size:12px;color:#777">${x.course_key}</div></div>
   <div class="field"><label>السعر الحالي</label><input type="number" id="cur-${x.course_key}" value="${x.current_price}"></div>
   <div class="field"><label>السعر قبل الخصم</label><input type="number" id="old-${x.course_key}" value="${x.old_price}"></div>
   <button class="primary" onclick="savePrice('${x.course_key}')">حفظ</button>
 </div>`).join('');
}
window.savePrice=async function(key){
 const current=Number(document.getElementById('cur-'+key).value), old=Number(document.getElementById('old-'+key).value);
 const {error:err}=await supabase.from('workshop_prices').update({current_price:current,old_price:old,updated_at:new Date().toISOString()}).eq('course_key',key);
 const ok=document.getElementById('saveOk'), bad=document.getElementById('saveErr');
 if(err){bad.textContent=err.message;bad.style.display='block';ok.style.display='none'} else {ok.style.display='block';bad.style.display='none';setTimeout(()=>ok.style.display='none',2200)}
}
document.getElementById('loginBtn').onclick=async()=>{
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 const {data,error:err}=await supabase.auth.signInWithPassword({email,password});
 if(err) return error(err.message);
 openDashboard(data.session);
};
document.getElementById('logoutBtn').onclick=async()=>{await supabase.auth.signOut();show(dashboard,false);show(login,true)};
supabase.auth.onAuthStateChange((_event,session)=>{
  if(session && session.user.email === "wmr77077@gmail.com") openDashboard(session);
});
init();
</script>
</body>
</html>
